<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رزان</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#08080f;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  background:#141422;
  text-align:center;
  padding:25px;
  font-size:30px;
  font-weight:bold;
}
.container{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}
.card{
  background:#151520;
  padding:25px;
  border-radius:20px;
}
h1{text-align:center}
input{
  width:100%;
  padding:18px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  font-size:18px;
}
button{
  width:100%;
  padding:17px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  background:#6557f5;
  color:white;
  font-size:19px;
  font-weight:bold;
}
.netflix{
  background:#e50914;
}
video{
  width:100%;
  background:black;
  border-radius:16px;
  margin-top:15px;
}
#roomPage{display:none}
#messages{
  height:180px;
  overflow-y:auto;
  background:#0d0d16;
  border-radius:14px;
  padding:12px;
  margin-top:15px;
}
.msg{
  padding:7px;
  border-bottom:1px solid #222;
}
.code{
  color:#9b8cff;
  font-size:25px;
  font-weight:bold;
}
.note{
  font-size:13px;
  color:#aaa;
  text-align:center;
}
</style>
</head>

<body>

<header>🎬 رزان</header>

<div class="container">

<div id="homePage" class="card">
  <h1>🍿 شاهدوا رزان</h1>

  <input id="name" placeholder="اسمك">

  <button onclick="createRoom()">إنشاء غرفة</button>

  <input id="roomInput" placeholder="اكتب رمز الغرفة">

  <button onclick="joinRoom()">دخول الغرفة</button>
</div>

<div id="roomPage" class="card">

  <h1>الغرفة</h1>

  <p>رمز الغرفة:
    <span id="roomCode" class="code"></span>
  </p>

  <button class="netflix" onclick="openNetflix()">
    ▶ Netflix
  </button>

  <p class="note">
    يفتح Netflix في نافذة منفصلة، ورزان تبقى للمزامنة والدردشة.
  </p>

  <input id="videoUrl" placeholder="رابط فيديو مباشر">

  <button onclick="loadVideo()">تشغيل الفيديو</button>

  <video id="video" controls playsinline></video>

  <div id="messages"></div>

  <input id="messageInput" placeholder="اكتب رسالة...">

  <button onclick="sendMessage()">إرسال</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let currentRoom = "";
let myName = "";
let receivingSync = false;

const video = document.getElementById("video");
const messages = document.getElementById("messages");

function randomRoom(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";

  for(let i=0;i<6;i++){
    code += chars[Math.floor(Math.random()*chars.length)];
  }

  return code;
}

function createRoom(){
  myName = document.getElementById("name").value.trim();

  if(!myName){
    alert("اكتب اسمك");
    return;
  }

  currentRoom = randomRoom();
  enterRoom();
}

function joinRoom(){
  myName = document.getElementById("name").value.trim();
  currentRoom =
    document.getElementById("roomInput").value.trim().toUpperCase();

  if(!myName){
    alert("اكتب اسمك");
    return;
  }

  if(!currentRoom){
    alert("اكتب رمز الغرفة");
    return;
  }

  enterRoom();
}

function enterRoom(){
  document.getElementById("homePage").style.display = "none";
  document.getElementById("roomPage").style.display = "block";
  document.getElementById("roomCode").textContent = currentRoom;

  socket.emit("join", {
    room: currentRoom,
    name: myName
  });
}

function openNetflix(){
  window.open("https://www.netflix.com/", "_blank");
}

function loadVideo(){
  const url = document.getElementById("videoUrl").value.trim();

  if(!url) return;

  socket.emit("video", url);
}

function sendSync(){
  if(receivingSync) return;

  socket.emit("sync", {
    time: video.currentTime,
    playing: !video.paused
  });
}

video.addEventListener("play", sendSync);
video.addEventListener("pause", sendSync);
video.addEventListener("seeked", sendSync);

function sendMessage(){
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if(!text) return;

  socket.emit("chat", text);
  input.value = "";
}

socket.on("video", (url)=>{
  video.src = url;
  video.load();
});

socket.on("sync", async(data)=>{
  receivingSync = true;

  if(Math.abs(video.currentTime - data.time) > 1){
    video.currentTime = data.time;
  }

  if(data.playing){
    try{
      await video.play();
    }catch(e){}
  }else{
    video.pause();
  }

  setTimeout(()=>{
    receivingSync = false;
  },300);
});

socket.on("room-state", (state)=>{
  if(state.video){
    video.src = state.video;
    video.load();

    video.addEventListener("loadedmetadata", async()=>{
      video.currentTime = state.time || 0;

      if(state.playing){
        try{
          await video.play();
        }catch(e){}
      }
    },{once:true});
  }
});

socket.on("chat", (data)=>{
  const div = document.createElement("div");
  div.className = "msg";
  div.textContent = data.name + ": " + data.text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
});

socket.on("system", (text)=>{
  const div = document.createElement("div");
  div.className = "msg";
  div.textContent = "• " + text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
});
</script>

</body>
</html>
