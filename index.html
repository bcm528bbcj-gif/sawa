<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رزان</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08080f;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  background:#141422;
  text-align:center;
  padding:25px;
  font-size:30px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#151520;
  padding:25px;
  border-radius:20px;
}

h1{text-align:center}

input{
  width:100%;
  padding:18px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  font-size:18px;
}

button{
  width:100%;
  padding:17px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  background:#6557f5;
  color:white;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.netflix{
  background:#e50914;
}

video{
  width:100%;
  background:black;
  border-radius:16px;
  margin-top:15px;
}

#roomPage{
  display:none;
}

#messages{
  height:220px;
  overflow-y:auto;
  background:#0d0d16;
  border-radius:14px;
  padding:12px;
  margin-top:15px;
}

.msg{
  padding:9px;
  margin-bottom:5px;
  background:#191925;
  border-radius:9px;
}

.myMsg{
  background:#312d68;
}

.systemMsg{
  color:#aaa;
  text-align:center;
  font-size:14px;
}

.code{
  color:#9b8cff;
  font-size:25px;
  font-weight:bold;
}

.note{
  font-size:13px;
  color:#aaa;
  text-align:center;
}
</style>
</head>

<body>

<header>🎬 رزان</header>

<div class="container">

  <!-- الصفحة الرئيسية -->
  <div id="homePage" class="card">

    <h1>🍿 شاهدوا رزان</h1>

    <input id="name" placeholder="اسمك">

    <button type="button" onclick="createRoom()">
      إنشاء غرفة
    </button>

    <input id="roomInput" placeholder="اكتب رمز الغرفة">

    <button type="button" onclick="joinRoom()">
      دخول الغرفة
    </button>

  </div>


  <!-- الغرفة -->
  <div id="roomPage" class="card">

    <h1>الغرفة</h1>

    <p>
      رمز الغرفة:
      <span id="roomCode" class="code"></span>
    </p>

    <!-- Netflix -->
    <input
      id="netflixUrl"
      placeholder="الصق رابط الفيلم أو الحلقة من Netflix"
    >

    <button
      type="button"
      class="netflix"
      onclick="openNetflixTogether()"
    >
      ▶ فتح Netflix للجميع
    </button>

    <p class="note">
      الصق رابط Netflix ثم اضغط الزر لإرساله لأعضاء الغرفة.
    </p>


    <!-- الفيديو المباشر -->
    <input
      id="videoUrl"
      placeholder="رابط فيديو مباشر"
    >

    <button
      type="button"
      onclick="loadVideo()"
    >
      تشغيل الفيديو للجميع
    </button>

    <video
      id="video"
      controls
      playsinline
    ></video>


    <!-- الدردشة -->
    <div id="messages"></div>

    <input
      id="messageInput"
      placeholder="اكتب رسالة..."
      autocomplete="off"
    >

    <button
      type="button"
      onclick="sendMessage()"
    >
      إرسال
    </button>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let currentRoom = "";
let myName = "";
let receivingSync = false;

const video =
  document.getElementById("video");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");


// إنشاء رمز غرفة
function randomRoom(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for(let i = 0; i < 6; i++){
    code += chars[
      Math.floor(Math.random() * chars.length)
    ];
  }

  return code;
}


// إنشاء غرفة
function createRoom(){

  myName =
    document.getElementById("name")
    .value
    .trim();

  if(!myName){
    alert("اكتب اسمك");
    return;
  }

  currentRoom = randomRoom();

  enterRoom();
}


// دخول غرفة
function joinRoom(){

  myName =
    document.getElementById("name")
    .value
    .trim();

  currentRoom =
    document.getElementById("roomInput")
    .value
    .trim()
    .toUpperCase();

  if(!myName){
    alert("اكتب اسمك");
    return;
  }

  if(!currentRoom){
    alert("اكتب رمز الغرفة");
    return;
  }

  enterRoom();
}


// فتح صفحة الغرفة
function enterRoom(){

  document.getElementById("homePage")
    .style.display = "none";

  document.getElementById("roomPage")
    .style.display = "block";

  document.getElementById("roomCode")
    .textContent = currentRoom;

  socket.emit("join", {
    room: currentRoom,
    name: myName
  });
}


// إضافة رسالة إلى الشاشة
function addMessage(name, text, mine = false){

  const div =
    document.createElement("div");

  div.className =
    mine ? "msg myMsg" : "msg";

  div.textContent =
    name + ": " + text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
}


// إرسال رسالة
function sendMessage(){

  const text =
    messageInput.value.trim();

  if(!text){
    return;
  }

  // تظهر عندي فورًا
  addMessage(myName, text, true);

  // إرسالها لباقي أعضاء الغرفة
  socket.emit("chat", text);

  messageInput.value = "";

  messageInput.focus();
}


// الضغط على Enter يرسل
messageInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      event.preventDefault();
      sendMessage();
    }

  }
);


// استقبال الرسائل
socket.on("chat", (data)=>{

  // السيرفر يرجع الرسالة للمرسل أيضًا
  // لذلك لا نكرر رسالتي على الشاشة
  if(data.name === myName){
    return;
  }

  addMessage(
    data.name || "زائر",
    data.text || "",
    false
  );

});


// رسائل الدخول والخروج
socket.on("system", (text)=>{

  const div =
    document.createElement("div");

  div.className =
    "msg systemMsg";

  div.textContent =
    "• " + text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

});


// Netflix
function openNetflixTogether(){

  let url =
    document.getElementById("netflixUrl")
    .value
    .trim();

  if(!url){
    url = "https://www.netflix.com/";
  }

  if(
    !url.startsWith("https://www.netflix.com") &&
    !url.startsWith("https://netflix.com")
  ){
    alert("الصق رابط Netflix صحيح");
    return;
  }

  socket.emit("netflix", url);

  window.open(url, "_blank");
}


// استقبال رابط Netflix
socket.on("netflix", (url)=>{

  const openIt = confirm(
    "🍿 تم إرسال رابط Netflix لك. هل تريد فتحه؟"
  );

  if(openIt){
    window.open(url, "_blank");
  }

});


// تشغيل فيديو مباشر
function loadVideo(){

  const url =
    document.getElementById("videoUrl")
    .value
    .trim();

  if(!url){
    return;
  }

  socket.emit("video", url);
}


// استقبال الفيديو
socket.on("video", (url)=>{

  video.src = url;

  video.load();

});


// إرسال حالة الفيديو
function sendSync(){

  if(receivingSync){
    return;
  }

  socket.emit("sync", {
    time: video.currentTime,
    playing: !video.paused
  });

}

video.addEventListener(
  "play",
  sendSync
);

video.addEventListener(
  "pause",
  sendSync
);

video.addEventListener(
  "seeked",
  sendSync
);


// استقبال المزامنة
socket.on("sync", async(data)=>{

  receivingSync = true;

  if(
    Math.abs(
      video.currentTime - data.time
    ) > 1
  ){
    video.currentTime = data.time;
  }

  if(data.playing){

    try{
      await video.play();
    }catch(e){}

  }else{

    video.pause();

  }

  setTimeout(()=>{
    receivingSync = false;
  },300);

});


// حالة الغرفة
socket.on("room-state", (state)=>{

  if(!state){
    return;
  }

  if(state.video){

    video.src = state.video;

    video.load();

    video.addEventListener(
      "loadedmetadata",
      async()=>{

        video.currentTime =
          state.time || 0;

        if(state.playing){

          try{
            await video.play();
          }catch(e){}

        }

      },
      {once:true}
    );

  }

});


// حالة الاتصال
socket.on("connect", ()=>{

  console.log("Connected");

});

socket.on("disconnect", ()=>{

  console.log("Disconnected");

});

</script>

</body>
</html>
