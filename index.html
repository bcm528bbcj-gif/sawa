<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>رزان</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">

<meta name="theme-color" content="#141422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رزان">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08080f;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

header{
  background:#141422;
  text-align:center;
  padding:25px;
  padding-top:max(25px,env(safe-area-inset-top));
  font-size:30px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#151520;
  padding:25px;
  border-radius:20px;
}

h1{text-align:center}

input{
  width:100%;
  padding:18px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  font-size:18px;
}

button{
  width:100%;
  padding:17px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  background:#6557f5;
  color:white;
  font-size:19px;
  font-weight:bold;
}

.netflix{background:#e50914}
.youtube{background:#ff0000}

video{
  width:100%;
  background:black;
  border-radius:16px;
  margin-top:15px;
}

#youtubeBox{
  display:none;
  width:100%;
  aspect-ratio:16/9;
  margin-top:15px;
  overflow:hidden;
  border-radius:16px;
  background:black;
}

#youtubePlayer{
  width:100%;
  height:100%;
}

#roomPage{display:none}

#messages{
  height:220px;
  overflow-y:auto;
  background:#0d0d16;
  border-radius:14px;
  padding:12px;
  margin-top:15px;
}

.msg{
  padding:9px;
  margin-bottom:5px;
  background:#191925;
  border-radius:9px;
}

.myMsg{background:#312d68}

.systemMsg{
  color:#aaa;
  text-align:center;
  font-size:14px;
}

.code{
  color:#9b8cff;
  font-size:25px;
  font-weight:bold;
}

.note{
  font-size:13px;
  color:#aaa;
  text-align:center;
}
</style>
</head>

<body>

<header>🎬 رزان</header>

<div class="container">

<div id="homePage" class="card">

<h1>🍿 شاهدوا رزان</h1>

<input id="name" placeholder="اسمك" autocomplete="off">

<button type="button" onclick="createRoom()">
إنشاء غرفة
</button>

<input id="roomInput" placeholder="اكتب رمز الغرفة" autocomplete="off">

<button type="button" onclick="joinRoom()">
دخول الغرفة
</button>

</div>


<div id="roomPage" class="card">

<h1>الغرفة</h1>

<p>
رمز الغرفة:
<span id="roomCode" class="code"></span>
</p>


<input
id="youtubeUrl"
placeholder="الصق رابط فيديو YouTube">

<button
type="button"
class="youtube"
onclick="loadYouTube()">
▶ تشغيل YouTube للجميع
</button>

<p class="note">
تشغيل وإيقاف وتقديم YouTube يتزامن بين أعضاء الغرفة.
</p>

<div id="youtubeBox">
  <div id="youtubePlayer"></div>
</div>


<input
id="netflixUrl"
placeholder="الصق رابط الفيلم أو الحلقة من Netflix">

<button
type="button"
class="netflix"
onclick="openNetflixTogether()">
▶ فتح Netflix للجميع
</button>


<input
id="videoUrl"
placeholder="رابط فيديو مباشر MP4">

<button
type="button"
onclick="loadVideo()">
تشغيل الفيديو للجميع
</button>

<video id="video" controls playsinline></video>


<div id="messages"></div>

<input
id="messageInput"
placeholder="اكتب رسالة..."
autocomplete="off">

<button
type="button"
onclick="sendMessage()">
إرسال
</button>

</div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>

const socket = io();

let currentRoom = "";
let myName = "";

let receivingSync = false;
let receivingYouTubeSync = false;

let youtubePlayer = null;
let youtubeReady = false;
let pendingYouTubeId = null;
let pendingYouTubeState = null;

let lastYoutubeState = -1;

const video =
document.getElementById("video");

const messages =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const youtubeBox =
document.getElementById("youtubeBox");


/* =========================
   ROOM
========================= */

function randomRoom(){

  const chars =
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for(let i=0;i<6;i++){
    code += chars[
      Math.floor(Math.random()*chars.length)
    ];
  }

  return code;
}


function createRoom(){

  myName =
  document.getElementById("name")
  .value.trim();

  if(!myName){
    alert("اكتب اسمك");
    return;
  }

  currentRoom = randomRoom();

  enterRoom();
}


function joinRoom(){

  myName =
  document.getElementById("name")
  .value.trim();

  currentRoom =
  document.getElementById("roomInput")
  .value.trim()
  .toUpperCase();

  if(!myName){
    alert("اكتب اسمك");
    return;
  }

  if(!currentRoom){
    alert("اكتب رمز الغرفة");
    return;
  }

  enterRoom();
}


function enterRoom(){

  document.getElementById("homePage")
  .style.display = "none";

  document.getElementById("roomPage")
  .style.display = "block";

  document.getElementById("roomCode")
  .textContent = currentRoom;

  socket.emit("join",{
    room:currentRoom,
    name:myName
  });
}


/* =========================
   YOUTUBE URL
========================= */

function getYouTubeId(input){

  if(!input) return null;

  let url =
  String(input)
  .trim()
  .replace(/\s+/g,"");

  if(
    !url.startsWith("http://") &&
    !url.startsWith("https://")
  ){
    url =
    "https://" +
    url.replace(/^\/+/,"");
  }

  try{

    const parsed =
    new URL(url);

    const host =
    parsed.hostname
    .toLowerCase()
    .replace(/^www\./,"");

    if(host === "youtu.be"){

      return parsed.pathname
      .replace(/^\/+/,"")
      .split("/")[0] || null;
    }

    if(
      host === "youtube.com" ||
      host === "m.youtube.com" ||
      host === "music.youtube.com"
    ){

      const v =
      parsed.searchParams.get("v");

      if(v) return v;

      if(
        parsed.pathname
        .startsWith("/shorts/")
      ){
        return parsed.pathname
        .split("/shorts/")[1]
        .split("/")[0];
      }

      if(
        parsed.pathname
        .startsWith("/embed/")
      ){
        return parsed.pathname
        .split("/embed/")[1]
        .split("/")[0];
      }

      if(
        parsed.pathname
        .startsWith("/live/")
      ){
        return parsed.pathname
        .split("/live/")[1]
        .split("/")[0];
      }
    }

    return null;

  }catch(e){

    return null;
  }
}


/* =========================
   YOUTUBE PLAYER
========================= */

function onYouTubeIframeAPIReady(){

  youtubePlayer =
  new YT.Player("youtubePlayer",{

    width:"100%",
    height:"100%",

    playerVars:{
      playsinline:1,
      rel:0
    },

    events:{

      onReady:function(){

        youtubeReady = true;

        if(pendingYouTubeId){

          youtubePlayer
          .cueVideoById(
            pendingYouTubeId
          );

          pendingYouTubeId = null;
        }

        if(pendingYouTubeState){

          applyYouTubeSync(
            pendingYouTubeState
          );

          pendingYouTubeState = null;
        }
      },

      onStateChange:
      onYouTubeStateChange
    }

  });
}


function showYouTube(url){

  const id =
  getYouTubeId(url);

  if(!id){
    alert(
      "رابط YouTube غير صحيح"
    );
    return;
  }

  try{
    video.pause();
  }catch(e){}

  video.style.display =
  "none";

  youtubeBox.style.display =
  "block";

  if(
    youtubeReady &&
    youtubePlayer
  ){

    receivingYouTubeSync = true;

    youtubePlayer
    .cueVideoById(id);

    setTimeout(()=>{
      receivingYouTubeSync = false;
    },800);

  }else{

    pendingYouTubeId = id;
  }
}


function loadYouTube(){

  let url =
  document.getElementById(
    "youtubeUrl"
  ).value.trim();

  const id =
  getYouTubeId(url);

  if(!id){

    alert(
      "الصق رابط YouTube صحيح"
    );

    return;
  }

  url =
  "https://www.youtube.com/watch?v=" +
  encodeURIComponent(id);

  document.getElementById(
    "youtubeUrl"
  ).value = url;

  socket.emit(
    "youtube",
    url
  );
}


socket.on(
"youtube",
(url)=>{

  showYouTube(url);

});


/* =========================
   YOUTUBE SYNC
========================= */

function sendYouTubeSync(){

  if(
    receivingYouTubeSync ||
    !youtubeReady ||
    !youtubePlayer
  ){
    return;
  }

  let time = 0;
  let state = -1;

  try{

    time =
    youtubePlayer
    .getCurrentTime() || 0;

    state =
    youtubePlayer
    .getPlayerState();

  }catch(e){
    return;
  }

  const playing =
  state === YT.PlayerState.PLAYING;

  socket.emit(
    "youtube-sync",
    {
      time:time,
      playing:playing
    }
  );
}


function onYouTubeStateChange(event){

  if(receivingYouTubeSync){
    return;
  }

  const state =
  event.data;

  /*
    نتعامل مع التشغيل والإيقاف فقط.
    ونتجنب إرسال نفس الحالة
    بشكل متكرر.
  */

  if(
    state === YT.PlayerState.PLAYING ||
    state === YT.PlayerState.PAUSED
  ){

    if(
      state !== lastYoutubeState
    ){

      lastYoutubeState = state;

      sendYouTubeSync();
    }
  }
}


/*
  إرسال تحديث أثناء التشغيل.
  هذا يساعد في مزامنة التقديم
  والرجوع في الفيديو.
*/

setInterval(()=>{

  if(
    !youtubeReady ||
    !youtubePlayer ||
    receivingYouTubeSync
  ){
    return;
  }

  try{

    const state =
    youtubePlayer
    .getPlayerState();

    if(
      state ===
      YT.PlayerState.PLAYING
    ){
      sendYouTubeSync();
    }

  }catch(e){}

},3000);


function applyYouTubeSync(data){

  if(
    !youtubeReady ||
    !youtubePlayer
  ){

    pendingYouTubeState = data;

    return;
  }

  receivingYouTubeSync = true;

  const time =
  Math.max(
    0,
    Number(data.time) || 0
  );

  try{

    const current =
    youtubePlayer
    .getCurrentTime() || 0;

    if(
      Math.abs(current-time) > 1
    ){

      youtubePlayer
      .seekTo(time,true);
    }

    if(data.playing){

      youtubePlayer
      .playVideo();

    }else{

      youtubePlayer
      .pauseVideo();
    }

  }catch(e){}

  setTimeout(()=>{

    receivingYouTubeSync = false;

  },800);
}


socket.on(
"youtube-sync",
(data)=>{

  applyYouTubeSync(data);

});


/* =========================
   NETFLIX
========================= */

function openNetflixTogether(){

  let url =
  document.getElementById(
    "netflixUrl"
  ).value.trim();

  if(!url){

    url =
    "https://www.netflix.com/";
  }

  if(
    !url.startsWith(
      "https://www.netflix.com"
    ) &&
    !url.startsWith(
      "https://netflix.com"
    )
  ){

    alert(
      "الصق رابط Netflix صحيح"
    );

    return;
  }

  socket.emit(
    "netflix",
    url
  );

  window.open(
    url,
    "_blank"
  );
}


socket.on(
"netflix",
(url)=>{

  const openIt =
  confirm(
    "🍿 تم إرسال رابط Netflix لك. هل تريد فتحه؟"
  );

  if(openIt){

    window.open(
      url,
      "_blank"
    );
  }

});


/* =========================
   MP4
========================= */

function loadVideo(){

  const url =
  document.getElementById(
    "videoUrl"
  ).value.trim();

  if(!url) return;

  socket.emit(
    "video",
    url
  );
}


socket.on(
"video",
(url)=>{

  youtubeBox.style.display =
  "none";

  try{

    if(
      youtubeReady &&
      youtubePlayer
    ){
      youtubePlayer.stopVideo();
    }

  }catch(e){}

  video.style.display =
  "block";

  video.src = url;

  video.load();
});


function sendSync(){

  if(receivingSync){
    return;
  }

  socket.emit(
    "sync",
    {
      time:video.currentTime,
      playing:!video.paused
    }
  );
}


video.addEventListener(
"play",
sendSync
);

video.addEventListener(
"pause",
sendSync
);

video.addEventListener(
"seeked",
sendSync
);


socket.on(
"sync",
async(data)=>{

  receivingSync = true;

  if(
    Math.abs(
      video.currentTime -
      data.time
    ) > 1
  ){

    video.currentTime =
    data.time;
  }

  if(data.playing){

    try{
      await video.play();
    }catch(e){}

  }else{

    video.pause();
  }

  setTimeout(()=>{

    receivingSync = false;

  },300);
});


/* =========================
   CHAT
========================= */

function addMessage(
name,
text,
mine=false
){

  const div =
  document.createElement("div");

  div.className =
  mine
  ? "msg myMsg"
  : "msg";

  div.textContent =
  name + ": " + text;

  messages.appendChild(div);

  messages.scrollTop =
  messages.scrollHeight;
}


function sendMessage(){

  const text =
  messageInput
  .value.trim();

  if(!text) return;

  addMessage(
    myName,
    text,
    true
  );

  socket.emit(
    "chat",
    text
  );

  messageInput.value = "";
}


messageInput.addEventListener(
"keydown",
(event)=>{

  if(event.key === "Enter"){

    event.preventDefault();

    sendMessage();
  }

});


socket.on(
"chat",
(data)=>{

  if(
    data.name === myName
  ){
    return;
  }

  addMessage(
    data.name || "زائر",
    data.text || ""
  );

});


socket.on(
"system",
(text)=>{

  const div =
  document.createElement("div");

  div.className =
  "msg systemMsg";

  div.textContent =
  "• " + text;

  messages.appendChild(div);
});


/* =========================
   ROOM STATE
========================= */

socket.on(
"room-state",
(state)=>{

  if(!state) return;

  if(state.youtube){

    showYouTube(
      state.youtube
    );

    pendingYouTubeState = {
      time:
      state.youtubeTime || 0,

      playing:
      !!state.youtubePlaying
    };

    if(youtubeReady){

      setTimeout(()=>{

        applyYouTubeSync(
          pendingYouTubeState
        );

        pendingYouTubeState = null;

      },800);
    }

    return;
  }

  if(state.video){

    youtubeBox.style.display =
    "none";

    video.style.display =
    "block";

    video.src =
    state.video;

    video.load();

    video.addEventListener(
    "loadedmetadata",
    async()=>{

      video.currentTime =
      state.time || 0;

      if(state.playing){

        try{
          await video.play();
        }catch(e){}

      }

    },
    {once:true}
    );
  }

});

</script>

</body>
</html>
