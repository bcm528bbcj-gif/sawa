<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوا</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #151522;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #181824;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
    }

    h2 { margin-top: 0; }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #6c5cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #room {
      display: none;
    }

    video {
      width: 100%;
      background: black;
      border-radius: 12px;
      margin-top: 15px;
    }

    #messages {
      height: 180px;
      overflow-y: auto;
      background: #0e0e16;
      padding: 10px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .msg {
      padding: 7px;
      border-bottom: 1px solid #252535;
    }

    .roomCode {
      color: #9c91ff;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>🎬 سوا</header>

<div class="container">

  <div id="home" class="card">
    <h2>شاهدوا سوا 🍿</h2>

    <input id="name" placeholder="اسمك">

    <button onclick="createRoom()">إنشاء غرفة</button>

    <input id="roomInput" placeholder="اكتب رمز الغرفة">

    <button onclick="joinRoom()">دخول الغرفة</button>
  </div>

  <div id="room" class="card">
    <h2>الغرفة</h2>

    <p>
      رمز الغرفة:
      <span id="roomCode" class="roomCode"></span>
    </p>

    <input id="videoUrl" placeholder="رابط فيديو مباشر">

    <button onclick="loadVideo()">تشغيل الفيديو</button>

    <video id="video" controls playsinline></video>

    <div id="messages"></div>

    <input id="message" placeholder="اكتب رسالة...">

    <button onclick="sendMessage()">إرسال</button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
  const socket = io();

  let currentRoom = "";
  let username = "";

  function createRoom() {
    username =
      document.getElementById("name").value.trim() || "ضيف";

    currentRoom = Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();

    enterRoom();
  }

  function joinRoom() {
    username =
      document.getElementById("name").value.trim() || "ضيف";

    currentRoom =
      document.getElementById("roomInput")
      .value.trim()
      .toUpperCase();

    if (!currentRoom) {
      alert("اكتب رمز الغرفة");
      return;
    }

    enterRoom();
  }

  function enterRoom() {
    socket.emit("join-room", currentRoom);

    document.getElementById("home").style.display = "none";
    document.getElementById("room").style.display = "block";
    document.getElementById("roomCode").textContent = currentRoom;
  }

  function loadVideo() {
    const url =
      document.getElementById("videoUrl").value.trim();

    if (!url) return;

    document.getElementById("video").src = url;

    socket.emit("video-change", {
      room: currentRoom,
      url: url
    });
  }

  function sendMessage() {
    const input = document.getElementById("message");
    const text = input.value.trim();

    if (!text) return;

    socket.emit("chat-message", {
      room: currentRoom,
      name: username,
      text: text
    });

    input.value = "";
  }

  socket.on("chat-message", data => {
    const div = document.createElement("div");
    div.className = "msg";
    div.textContent = data.name + ": " + data.text;

    document.getElementById("messages").appendChild(div);
  });

  socket.on("video-change", url => {
    document.getElementById("video").src = url;
  });

  const video = document.getElementById("video");

  video.addEventListener("play", () => {
    if (currentRoom) {
      socket.emit("video-control", {
        room: currentRoom,
        action: "play",
        time: video.currentTime
      });
    }
  });

  video.addEventListener("pause", () => {
    if (currentRoom) {
      socket.emit("video-control", {
        room: currentRoom,
        action: "pause",
        time: video.currentTime
      });
    }
  });

  socket.on("video-control", data => {
    video.currentTime = data.time;

    if (data.action === "play") {
      video.play().catch(() => {});
    } else {
      video.pause();
    }
  });
</script>

</body>
</html>
