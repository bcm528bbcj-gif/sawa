<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>رزان 🎬</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #08080f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 35px 20px;
      text-align: center;
      background: #12111d;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
    }

    .card {
      background: #15141f;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    h2 {
      text-align: center;
      font-size: 32px;
      margin-top: 5px;
    }

    input {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border: 0;
      border-radius: 15px;
      font-size: 17px;
      outline: none;
      text-align: right;
    }

    button {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: 0;
      border-radius: 15px;
      background: #6355ee;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .youtube-btn {
      background: #ff3028;
    }

    .room {
      background: #211f31;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    .code {
      font-size: 28px;
      color: #9d8cff;
      font-weight: bold;
      letter-spacing: 3px;
    }

    #player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 20px;
    }

    #player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .controls button {
      margin: 0;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin-top: 15px;
      min-height: 25px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>رزان 🎬</h1>
</header>

<div class="container">

  <div class="card">

    <h2>شاهدوا رزان 🍿</h2>

    <div class="room">
      <div>رمز الغرفة</div>
      <div class="code" id="roomCode">------</div>
    </div>

    <input
      id="nameInput"
      type="text"
      placeholder="اسمك"
    >

    <button onclick="createRoom()">
      إنشاء غرفة
    </button>

    <hr style="border-color:#292735;margin:25px 0">

    <input
      id="joinCode"
      type="text"
      placeholder="اكتب رمز الغرفة"
    >

    <button onclick="joinRoom()">
      دخول الغرفة
    </button>

    <hr style="border-color:#292735;margin:25px 0">

    <input
      id="youtubeInput"
      type="text"
      placeholder="الصق رابط YouTube هنا"
    >

    <button class="youtube-btn" onclick="loadYouTube()">
      ▶ تشغيل YouTube للجميع
    </button>

    <div id="player"></div>

    <div class="controls">
      <button onclick="playVideo()">▶ تشغيل</button>
      <button onclick="pauseVideo()">⏸ إيقاف</button>
      <button onclick="reloadVideo()">🔄 إعادة</button>
    </div>

    <div id="status">
      جاهز
    </div>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

  let socket = null;

  let room = null;
  let myName = "";

  let currentVideoId = null;
  let youtubeIframe = null;


  // استخراج رقم الفيديو من رابط YouTube
  function getYouTubeId(url) {

    if (!url) return null;

    url = url.trim();

    let match = url.match(
      /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?/]+)/
    );

    if (match) {
      return match[1];
    }

    return null;
  }


  // إنشاء الغرفة
  function createRoom() {

    myName =
      document.getElementById("nameInput").value.trim()
      || "مستخدم";

    room =
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

    document.getElementById("roomCode").textContent = room;

    connectSocket();

    setStatus("تم إنشاء الغرفة ✅");
  }


  // دخول الغرفة
  function joinRoom() {

    myName =
      document.getElementById("nameInput").value.trim()
      || "مستخدم";

    const code =
      document.getElementById("joinCode").value
      .trim()
      .toUpperCase();

    if (!code) {
      setStatus("اكتب رمز الغرفة أولاً");
      return;
    }

    room = code;

    document.getElementById("roomCode").textContent = room;

    connectSocket();

    setStatus("تم الدخول للغرفة ✅");
  }


  // الاتصال بالسيرفر
  function connectSocket() {

    if (socket) return;

    socket = io();

    socket.on("connect", function() {

      setStatus("متصل بالسيرفر 🟢");

      socket.emit("join-room", {
        room: room,
        name: myName
      });

    });


    // استقبال فيديو من صاحب الغرفة
    socket.on("youtube-load", function(data) {

      if (!data || !data.videoId) return;

      currentVideoId = data.videoId;

      showVideo(currentVideoId);

      setStatus("تم تحميل الفيديو للجميع 🎬");

    });


    socket.on("youtube-play", function() {

      playVideoLocal();

    });


    socket.on("youtube-pause", function() {

      pauseVideoLocal();

    });


    socket.on("youtube-reload", function() {

      reloadVideoLocal();

    });

  }


  // تشغيل فيديو YouTube
  function loadYouTube() {

    const input =
      document.getElementById("youtubeInput").value;

    const videoId = getYouTubeId(input);

    if (!videoId) {

      setStatus("❌ رابط YouTube غير صحيح");

      return;
    }

    currentVideoId = videoId;

    showVideo(videoId);

    setStatus("تم تحميل الفيديو 🎬");


    if (socket && room) {

      socket.emit("youtube-load", {

        room: room,
        videoId: videoId

      });

    }

  }


  // إظهار الفيديو
  function showVideo(videoId) {

    const player =
      document.getElementById("player");

    player.innerHTML = "";

    youtubeIframe =
      document.createElement("iframe");

    youtubeIframe.src =
      "https://www.youtube.com/embed/"
      + videoId
      + "?autoplay=1&enablejsapi=1";

    youtubeIframe.allow =
      "autoplay; encrypted-media; picture-in-picture";

    youtubeIframe.allowFullscreen = true;

    player.appendChild(youtubeIframe);

  }


  // إرسال أمر تشغيل
  function playVideo() {

    playVideoLocal();

    if (socket && room) {

      socket.emit("youtube-play", {
        room: room
      });

    }

  }


  // تشغيل محلي
  function playVideoLocal() {

    if (!youtubeIframe) return;

    youtubeIframe.contentWindow.postMessage(
      JSON.stringify({
        event: "command",
        func: "playVideo",
        args: []
      }),
      "*"
    );

  }


  // إرسال أمر إيقاف
  function pauseVideo() {

    pauseVideoLocal();

    if (socket && room) {

      socket.emit("youtube-pause", {
        room: room
      });

    }

  }


  // إيقاف محلي
  function pauseVideoLocal() {

    if (!youtubeIframe) return;

    youtubeIframe.contentWindow.postMessage(
      JSON.stringify({
        event: "command",
        func: "pauseVideo",
        args: []
      }),
      "*"
    );

  }


  // إعادة الفيديو
  function reloadVideo() {

    reloadVideoLocal();

    if (socket && room) {

      socket.emit("youtube-reload", {
        room: room
      });

    }

  }


  function reloadVideoLocal() {

    if (!currentVideoId) return;

    showVideo(currentVideoId);

  }


  function setStatus(text) {

    document.getElementById("status").textContent = text;

  }

</script>

</body>
</html>
