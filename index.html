<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>رزان 🎬</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">

<meta name="theme-color" content="#141422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رزان">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#08080f;
color:white;
font-family:Arial,sans-serif;
min-height:100vh;
}

header{
background:#141422;
text-align:center;
padding:28px;
padding-top:max(28px,env(safe-area-inset-top));
font-size:32px;
font-weight:bold;
}

.container{
width:min(650px,92%);
margin:30px auto;
}

.card{
background:#151520;
padding:25px;
border-radius:22px;
}

h1,h2{
text-align:center;
}

input{
width:100%;
padding:17px;
margin:8px 0;
border:0;
border-radius:14px;
font-size:17px;
outline:none;
}

button{
width:100%;
padding:17px;
margin:8px 0;
border:0;
border-radius:14px;
color:white;
background:#6557f5;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.youtube{
background:#ff0000;
}

.netflix{
background:#e50914;
}

.room{
background:#211f31;
border-radius:14px;
padding:15px;
text-align:center;
margin-bottom:15px;
}

.code{
color:#a496ff;
font-size:27px;
font-weight:bold;
letter-spacing:3px;
}

#roomPage{
display:none;
}

#youtubeBox{
display:none;
width:100%;
aspect-ratio:16/9;
margin-top:15px;
background:#000;
border-radius:16px;
overflow:hidden;
}

#youtubeFrame{
width:100%;
height:100%;
border:0;
}

video{
width:100%;
margin-top:15px;
border-radius:16px;
background:#000;
}

#messages{
height:210px;
overflow-y:auto;
background:#0d0d16;
border-radius:14px;
padding:12px;
margin-top:15px;
}

.msg{
padding:9px;
margin-bottom:6px;
border-radius:9px;
background:#191925;
}

.mine{
background:#312d68;
}

.system{
text-align:center;
color:#999;
font-size:13px;
}

.note{
color:#999;
font-size:13px;
text-align:center;
}

</style>

</head>


<body>

<header>
🎬 رزان
</header>


<div class="container">


<!-- الرئيسية -->

<div id="homePage" class="card">

<h1>🍿 شاهدوا رزان</h1>

<input
id="name"
placeholder="اسمك"
autocomplete="off">

<button onclick="createRoom()">
إنشاء غرفة
</button>

<input
id="roomInput"
placeholder="رمز الغرفة"
autocomplete="off">

<button onclick="joinRoom()">
دخول الغرفة
</button>

</div>



<!-- الغرفة -->

<div id="roomPage" class="card">

<h2>غرفة المشاهدة 🎬</h2>


<div class="room">

<div>
رمز الغرفة
</div>

<div
id="roomCode"
class="code">
------
</div>

</div>



<!-- YouTube -->

<input
id="youtubeUrl"
placeholder="الصق رابط YouTube">

<button
class="youtube"
onclick="loadYouTube()">

▶ تشغيل YouTube للجميع

</button>

<p class="note">
التشغيل والإيقاف والتقديم تتم مزامنتها بين أعضاء الغرفة.
</p>


<div id="youtubeBox">

<iframe
id="youtubeFrame"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>

</div>



<!-- Netflix -->

<input
id="netflixUrl"
placeholder="الصق رابط فيلم Netflix">

<button
class="netflix"
onclick="openNetflixTogether()">

▶ فتح Netflix للجميع

</button>

<p class="note">
يفتح رابط الفيلم عند أعضاء الغرفة.
</p>



<!-- MP4 -->

<input
id="videoUrl"
placeholder="رابط فيديو مباشر MP4">

<button onclick="loadVideo()">

▶ تشغيل الفيديو للجميع

</button>


<video
id="video"
controls
playsinline>
</video>



<!-- الدردشة -->

<div id="messages"></div>

<input
id="messageInput"
placeholder="اكتب رسالة..."
autocomplete="off">

<button onclick="sendMessage()">
إرسال 💬
</button>


</div>

</div>



<script src="/socket.io/socket.io.js"></script>


<script>

/* =========================
   الاتصال
========================= */

const socket = io();

let room = "";
let name = "";

let youtubeId = "";
let youtubeFrame = null;

let ignoreSync = false;


/* =========================
   الغرف
========================= */

function makeRoom(){

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let result="";

for(let i=0;i<6;i++){

result +=
chars[
Math.floor(
Math.random()*chars.length
)
];

}

return result;

}


function createRoom(){

name =
document
.getElementById("name")
.value
.trim();

if(!name){

alert("اكتب اسمك");

return;

}

room =
makeRoom();

enterRoom();

}


function joinRoom(){

name =
document
.getElementById("name")
.value
.trim();

room =
document
.getElementById("roomInput")
.value
.trim()
.toUpperCase();

if(!name){

alert("اكتب اسمك");

return;

}

if(!room){

alert("اكتب رمز الغرفة");

return;

}

enterRoom();

}


function enterRoom(){

document
.getElementById("homePage")
.style.display="none";

document
.getElementById("roomPage")
.style.display="block";

document
.getElementById("roomCode")
.textContent=room;

socket.emit(
"join",
{
room:room,
name:name
}
);

}


/* =========================
   YouTube
========================= */

function getYouTubeId(value){

if(!value) return null;

let url =
value.trim();

if(
!url.startsWith("http://") &&
!url.startsWith("https://")
){

url =
"https://" + url;

}

try{

const u =
new URL(url);

const host =
u.hostname
.toLowerCase()
.replace(/^www\./,"");


if(host === "youtu.be"){

return u.pathname
.replace(/^\/+/,"")
.split("/")[0];

}


if(
host === "youtube.com" ||
host === "m.youtube.com"
){

const v =
u.searchParams.get("v");

if(v){

return v;

}


if(
u.pathname.startsWith("/shorts/")
){

return u.pathname
.split("/shorts/")[1]
.split("/")[0];

}


if(
u.pathname.startsWith("/embed/")
){

return u.pathname
.split("/embed/")[1]
.split("/")[0];

}


if(
u.pathname.startsWith("/live/")
){

return u.pathname
.split("/live/")[1]
.split("/")[0];

}

}

}catch(e){}

return null;

}



/* عرض YouTube */

function showYouTube(id){

if(!id) return;

youtubeId=id;

document
.getElementById("video")
.style.display="none";

document
.getElementById("youtubeBox")
.style.display="block";

youtubeFrame =
document.getElementById(
"youtubeFrame"
);

youtubeFrame.src =
"https://www.youtube.com/embed/"
+
encodeURIComponent(id)
+
"?enablejsapi=1&playsinline=1&rel=0";

}


/* تشغيل YouTube */

function loadYouTube(){

const input =
document
.getElementById("youtubeUrl")
.value
.trim();

const id =
getYouTubeId(input);

if(!id){

alert(
"الصق رابط YouTube صحيح"
);

return;

}

showYouTube(id);

socket.emit(
"youtube",
id
);

}



/* استقبال الفيديو */

socket.on(
"youtube",
(id)=>{

showYouTube(id);

}
);


/* =========================
   مزامنة YouTube
========================= */


/*
إرسال أمر للطرف الثاني
*/

function youtubeCommand(
command,
time=null
){

if(ignoreSync){
return;
}

if(!room){
return;
}

socket.emit(
"youtube-sync",
{
command:command,
time:time
}
);

}


/* تشغيل */

function youtubePlay(){

if(!youtubeFrame){
return;
}

youtubeFrame.contentWindow.postMessage(
JSON.stringify({
event:"command",
func:"playVideo",
args:[]
}),
"*"
);

youtubeCommand("play");

}


/* إيقاف */

function youtubePause(){

if(!youtubeFrame){
return;
}

youtubeFrame.contentWindow.postMessage(
JSON.stringify({
event:"command",
func:"pauseVideo",
args:[]
}),
"*"
);

youtubeCommand("pause");

}


/* استقبال المزامنة */

socket.on(
"youtube-sync",
(data)=>{

if(!youtubeFrame){
return;
}

ignoreSync=true;


if(
data.command === "play"
){

youtubeFrame.contentWindow.postMessage(
JSON.stringify({
event:"command",
func:"playVideo",
args:[]
}),
"*"
);

}


if(
data.command === "pause"
){

youtubeFrame.contentWindow.postMessage(
JSON.stringify({
event:"command",
func:"pauseVideo",
args:[]
}),
"*"
);

}


if(
data.command === "seek"
&&
data.time !== null
){

youtubeFrame.contentWindow.postMessage(
JSON.stringify({
event:"command",
func:"seekTo",
args:[
Number(data.time),
true
]
}),
"*"
);

}


setTimeout(
()=>{
ignoreSync=false;
},
700
);

}
);


/*
ملاحظة:
YouTube يمنع بعض التحكم التلقائي
من داخل iframe حسب الجهاز والمتصفح.
لذلك التشغيل اليدوي يبقى متاحًا.
*/


/* =========================
   Netflix
========================= */

function openNetflixTogether(){

let url =
document
.getElementById("netflixUrl")
.value
.trim();

if(!url){

url =
"https://www.netflix.com/";

}

if(
!url.includes("netflix.com")
){

alert(
"الصق رابط Netflix صحيح"
);

return;

}

socket.emit(
"netflix",
url
);

window.open(
url,
"_blank"
);

}


socket.on(
"netflix",
(url)=>{

const answer =
confirm(
"🍿 تم إرسال رابط Netflix. فتحه؟"
);

if(answer){

window.open(
url,
"_blank"
);

}

}
);


/* =========================
   MP4
========================= */

const video =
document.getElementById(
"video"
);


function loadVideo(){

const url =
document
.getElementById("videoUrl")
.value
.trim();

if(!url){
return;
}

socket.emit(
"video",
url
);

}


socket.on(
"video",
(url)=>{

document
.getElementById("youtubeBox")
.style.display="none";

youtubeFrame.src="";

video.style.display="block";

video.src=url;

video.load();

}
);


/* مزامنة MP4 */

video.addEventListener(
"play",
()=>{

if(ignoreSync) return;

socket.emit(
"sync",
{
time:video.currentTime,
playing:true
}
);

}
);


video.addEventListener(
"pause",
()=>{

if(ignoreSync) return;

socket.emit(
"sync",
{
time:video.currentTime,
playing:false
}
);

}
);


video.addEventListener(
"seeked",
()=>{

if(ignoreSync) return;

socket.emit(
"sync",
{
time:video.currentTime,
playing:!video.paused
}
);

}
);


socket.on(
"sync",
async(data)=>{

ignoreSync=true;

if(
Math.abs(
video.currentTime -
Number(data.time)
)>1
){

video.currentTime =
Number(data.time);

}

if(data.playing){

try{

await video.play();

}catch(e){}

}else{

video.pause();

}

setTimeout(
()=>{
ignoreSync=false;
},
500
);

}
);


/* =========================
   الدردشة
========================= */

function addMessage(
username,
text,
mine=false
){

const div =
document.createElement("div");

div.className =
mine
?"msg mine"
:"msg";

div.textContent =
username +
": " +
text;

document
.getElementById("messages")
.appendChild(div);

const box =
document.getElementById(
"messages"
);

box.scrollTop =
box.scrollHeight;

}


function sendMessage(){

const input =
document.getElementById(
"messageInput"
);

const text =
input.value.trim();

if(!text){
return;
}

addMessage(
name,
text,
true
);

socket.emit(
"chat",
text
);

input.value="";

input.focus();

}


document
.getElementById("messageInput")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

e.preventDefault();

sendMessage();

}

}
);


socket.on(
"chat",
(data)=>{

if(
data.name === name
){
return;
}

addMessage(
data.name || "زائر",
data.text || "",
false
);

}
);


socket.on(
"system",
(text)=>{

const div =
document.createElement("div");

div.className =
"msg system";

div.textContent =
"• " + text;

document
.getElementById("messages")
.appendChild(div);

}
);


/* =========================
   حالة الغرفة
========================= */

socket.on(
"room-state",
(state)=>{

if(!state){
return;
}


if(state.youtube){

showYouTube(
state.youtube
);

return;

}


if(state.video){

document
.getElementById("youtubeBox")
.style.display="none";

video.style.display="block";

video.src =
state.video;

video.load();

}

}
);


/* =========================
   الاتصال
========================= */

socket.on(
"connect",
()=>{

console.log(
"Razan connected"
);

}
);


socket.on(
"disconnect",
()=>{

console.log(
"Razan disconnected"
);

}
);

</script>

</body>
</html>
