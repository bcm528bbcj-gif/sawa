<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>رزان 🎬</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">

<meta name="theme-color" content="#141422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رزان">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08080f;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

header{
  background:#141422;
  text-align:center;
  padding:28px;
  padding-top:max(28px,env(safe-area-inset-top));
  font-size:32px;
  font-weight:bold;
}

.container{
  width:min(650px,92%);
  margin:30px auto;
}

.card{
  background:#151520;
  padding:25px;
  border-radius:22px;
}

h1,h2{
  text-align:center;
}

input{
  width:100%;
  padding:17px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  font-size:17px;
  outline:none;
}

button{
  width:100%;
  padding:17px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  color:#fff;
  background:#6557f5;
  font-size:18px;
  font-weight:bold;
}

.youtube{
  background:#ff0000;
}

.netflix{
  background:#e50914;
}

.room{
  background:#211f31;
  border-radius:14px;
  padding:15px;
  text-align:center;
  margin-bottom:15px;
}

.code{
  color:#a496ff;
  font-size:27px;
  font-weight:bold;
  letter-spacing:3px;
}

#roomPage{
  display:none;
}

#youtubeBox{
  display:none;
  width:100%;
  aspect-ratio:16/9;
  margin-top:15px;
  background:#000;
  border-radius:16px;
  overflow:hidden;
}

#youtubeFrame{
  width:100%;
  height:100%;
}

#video{
  width:100%;
  margin-top:15px;
  border-radius:16px;
  background:#000;
}

#messages{
  height:210px;
  overflow-y:auto;
  background:#0d0d16;
  border-radius:14px;
  padding:12px;
  margin-top:15px;
}

.msg{
  padding:9px;
  margin-bottom:6px;
  border-radius:9px;
  background:#191925;
}

.mine{
  background:#312d68;
}

.system{
  text-align:center;
  color:#999;
  font-size:13px;
}

.note{
  color:#999;
  font-size:13px;
  text-align:center;
}

</style>
</head>


<body>

<header>
🎬 رزان
</header>


<div class="container">


<!-- الصفحة الرئيسية -->

<div id="homePage" class="card">

<h1>🍿 شاهدوا رزان</h1>

<input
id="name"
placeholder="اسمك"
autocomplete="off">

<button onclick="createRoom()">
إنشاء غرفة
</button>

<input
id="roomInput"
placeholder="رمز الغرفة"
autocomplete="off">

<button onclick="joinRoom()">
دخول الغرفة
</button>

</div>



<!-- الغرفة -->

<div id="roomPage" class="card">

<h2>غرفة المشاهدة 🎬</h2>


<div class="room">

<div>
رمز الغرفة
</div>

<div
id="roomCode"
class="code">
------
</div>

</div>



<!-- =====================
     YOUTUBE
===================== -->

<input
id="youtubeUrl"
placeholder="الصق رابط YouTube">

<button
class="youtube"
onclick="loadYouTube()">

▶ تشغيل YouTube للجميع

</button>

<p class="note">
YouTube يظهر داخل رزان.
</p>


<div id="youtubeBox">

<div id="youtubeFrame"></div>

</div>



<!-- =====================
     NETFLIX
===================== -->

<input
id="netflixUrl"
placeholder="الصق رابط فيلم Netflix">

<button
class="netflix"
onclick="openNetflixTogether()">

▶ فتح Netflix للجميع

</button>

<p class="note">
يفتح الرابط عند أعضاء الغرفة.
</p>



<!-- =====================
     MP4
===================== -->

<input
id="videoUrl"
placeholder="رابط فيديو مباشر MP4">

<button onclick="loadVideo()">

▶ تشغيل الفيديو للجميع

</button>

<video
id="video"
controls
playsinline>
</video>



<!-- =====================
     CHAT
===================== -->

<div id="messages"></div>

<input
id="messageInput"
placeholder="اكتب رسالة..."
autocomplete="off">

<button onclick="sendMessage()">
إرسال 💬
</button>

</div>

</div>



<script src="/socket.io/socket.io.js"></script>

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================
   الاتصال
========================= */

const socket = io();

let room = "";
let name = "";

let youtubePlayer = null;
let youtubeReady = false;

let youtubeId = "";

let applyingRemote = false;


/* =========================
   الغرف
========================= */

function makeRoom(){

  const chars =
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for(let i=0;i<6;i++){

    result += chars[
      Math.floor(
        Math.random()*chars.length
      )
    ];

  }

  return result;
}


function createRoom(){

  name =
  document
  .getElementById("name")
  .value
  .trim();

  if(!name){

    alert("اكتب اسمك");

    return;
  }

  room = makeRoom();

  enterRoom();

}


function joinRoom(){

  name =
  document
  .getElementById("name")
  .value
  .trim();

  room =
  document
  .getElementById("roomInput")
  .value
  .trim()
  .toUpperCase();

  if(!name){

    alert("اكتب اسمك");

    return;
  }

  if(!room){

    alert("اكتب رمز الغرفة");

    return;
  }

  enterRoom();

}


function enterRoom(){

  document
  .getElementById("homePage")
  .style.display = "none";

  document
  .getElementById("roomPage")
  .style.display = "block";

  document
  .getElementById("roomCode")
  .textContent = room;

  socket.emit(
    "join",
    {
      room:room,
      name:name
    }
  );

}



/* =========================
   YouTube ID
========================= */

function getYouTubeId(value){

  if(!value){
    return null;
  }

  let url =
  value
  .trim();

  if(
    !url.startsWith("http://") &&
    !url.startsWith("https://")
  ){

    url =
    "https://" + url;

  }

  try{

    const u =
    new URL(url);

    const host =
    u.hostname
    .toLowerCase()
    .replace(/^www\./,"");


    /* youtu.be */

    if(host === "youtu.be"){

      return u.pathname
      .replace(/^\/+/,"")
      .split("/")[0];

    }


    /* youtube.com */

    if(
      host === "youtube.com" ||
      host === "m.youtube.com"
    ){

      const v =
      u.searchParams.get("v");

      if(v){
        return v;
      }


      if(
        u.pathname
        .startsWith("/shorts/")
      ){

        return u.pathname
        .split("/shorts/")[1]
        .split("/")[0];

      }


      if(
        u.pathname
        .startsWith("/embed/")
      ){

        return u.pathname
        .split("/embed/")[1]
        .split("/")[0];

      }


      if(
        u.pathname
        .startsWith("/live/")
      ){

        return u.pathname
        .split("/live/")[1]
        .split("/")[0];

      }

    }

  }catch(error){

    console.log(error);

  }

  return null;

}



/* =========================
   YouTube API
========================= */

function onYouTubeIframeAPIReady(){

  youtubeReady = true;

  if(youtubeId){

    createYouTubePlayer(
      youtubeId
    );

  }

}


function createYouTubePlayer(id){

  youtubeId = id;

  document
  .getElementById("video")
  .style.display = "none";

  document
  .getElementById("youtubeBox")
  .style.display = "block";


  if(youtubePlayer){

    applyingRemote = true;

    youtubePlayer
    .loadVideoById(id);

    setTimeout(
      ()=>{
        applyingRemote = false;
      },
      800
    );

    return;
  }


  youtubePlayer =
  new YT.Player(
    "youtubeFrame",
    {

      width:"100%",
      height:"100%",

      videoId:id,

      playerVars:{
        autoplay:1,
        playsinline:1,
        controls:1,
        rel:0,
        modestbranding:1
      },

      events:{

        onReady:function(){

          console.log(
            "YouTube جاهز"
          );

        },

        onStateChange:
        youtubeStateChanged

      }

    }
  );

}



/* =========================
   تحميل YouTube
========================= */

function loadYouTube(){

  const input =
  document
  .getElementById("youtubeUrl")
  .value
  .trim();

  const id =
  getYouTubeId(input);

  if(!id){

    alert(
      "الصق رابط YouTube صحيح"
    );

    return;
  }

  createYouTubePlayer(id);

  socket.emit(
    "youtube",
    id
  );

}



/* استقبال فيديو جديد */

socket.on(
  "youtube",
  function(id){

    createYouTubePlayer(id);

  }
);



/* =========================
   مزامنة YouTube
========================= */

function youtubeStateChanged(event){

  if(!youtubePlayer){
    return;
  }

  if(applyingRemote){
    return;
  }


  if(
    event.data ===
    YT.PlayerState.PLAYING
  ){

    socket.emit(
      "youtube-sync",
      {
        command:"play",
        time:
          youtubePlayer
          .getCurrentTime()
      }
    );

  }


  if(
    event.data ===
    YT.PlayerState.PAUSED
  ){

    socket.emit(
      "youtube-sync",
      {
        command:"pause",
        time:
          youtubePlayer
          .getCurrentTime()
      }
    );

  }

}



/*
  إرسال الوقت كل ثانية ونصف
  لمزامنة التقديم والتأخير
*/

setInterval(
  function(){

    if(!youtubePlayer){
      return;
    }

    if(applyingRemote){
      return;
    }

    try{

      const state =
      youtubePlayer
      .getPlayerState();

      if(
        state ===
        YT.PlayerState.PLAYING
      ){

        socket.emit(
          "youtube-sync",
          {
            command:"time",
            time:
              youtubePlayer
              .getCurrentTime()
          }
        );

      }

    }catch(e){}

  },
  1500
);



/* استقبال أمر المزامنة */

socket.on(
  "youtube-sync",
  function(data){

    if(!youtubePlayer){
      return;
    }

    applyingRemote = true;

    try{

      const target =
      Number(data.time) || 0;


      if(
        data.command === "play"
      ){

        youtubePlayer
        .seekTo(
          target,
          true
        );

        youtubePlayer
        .playVideo();

      }


      else if(
        data.command === "pause"
      ){

        youtubePlayer
        .seekTo(
          target,
          true
        );

        youtubePlayer
        .pauseVideo();

      }


      else if(
        data.command === "time"
      ){

        const current =
        youtubePlayer
        .getCurrentTime();

        if(
          Math.abs(
            current-target
          ) > 2
        ){

          youtubePlayer
          .seekTo(
            target,
            true
          );

        }

      }

    }catch(e){

      console.log(
        "YouTube sync error",
        e
      );

    }


    setTimeout(
      function(){

        applyingRemote = false;

      },
      700
    );

  }
);



/* =========================
   Netflix
========================= */

function openNetflixTogether(){

  let url =
  document
  .getElementById("netflixUrl")
  .value
  .trim();

  if(!url){

    url =
    "https://www.netflix.com/";

  }

  if(
    !url.includes("netflix.com")
  ){

    alert(
      "الصق رابط Netflix صحيح"
    );

    return;
  }

  socket.emit(
    "netflix",
    url
  );

  window.open(
    url,
    "_blank"
  );

}


socket.on(
  "netflix",
  function(url){

    const answer =
    confirm(
      "🍿 تم إرسال رابط Netflix. فتحه؟"
    );

    if(answer){

      window.open(
        url,
        "_blank"
      );

    }

  }
);



/* =========================
   MP4
========================= */

const video =
document.getElementById("video");


function loadVideo(){

  const url =
  document
  .getElementById("videoUrl")
  .value
  .trim();

  if(!url){
    return;
  }

  socket.emit(
    "video",
    url
  );

}


socket.on(
  "video",
  function(url){

    document
    .getElementById("youtubeBox")
    .style.display = "none";

    if(youtubePlayer){

      try{
        youtubePlayer.stopVideo();
      }catch(e){}

    }

    video.style.display =
    "block";

    video.src = url;

    video.load();

  }
);


/* مزامنة MP4 */

video.addEventListener(
  "play",
  function(){

    if(applyingRemote){
      return;
    }

    socket.emit(
      "sync",
      {
        time:video.currentTime,
        playing:true
      }
    );

  }
);


video.addEventListener(
  "pause",
  function(){

    if(applyingRemote){
      return;
    }

    socket.emit(
      "sync",
      {
        time:video.currentTime,
        playing:false
      }
    );

  }
);


video.addEventListener(
  "seeked",
  function(){

    if(applyingRemote){
      return;
    }

    socket.emit(
      "sync",
      {
        time:video.currentTime,
        playing:!video.paused
      }
    );

  }
);


socket.on(
  "sync",
  async function(data){

    applyingRemote = true;

    const target =
    Number(data.time) || 0;

    if(
      Math.abs(
        video.currentTime-target
      ) > 1
    ){

      video.currentTime =
      target;

    }

    if(data.playing){

      try{

        await video.play();

      }catch(e){}

    }else{

      video.pause();

    }

    setTimeout(
      function(){

        applyingRemote = false;

      },
      500
    );

  }
);



/* =========================
   الدردشة
========================= */

function addMessage(
  username,
  text,
  mine=false
){

  const div =
  document.createElement("div");

  div.className =
  mine
  ? "msg mine"
  : "msg";

  div.textContent =
  username +
  ": " +
  text;

  const box =
  document.getElementById(
    "messages"
  );

  box.appendChild(div);

  box.scrollTop =
  box.scrollHeight;

}


function sendMessage(){

  const input =
  document.getElementById(
    "messageInput"
  );

  const text =
  input.value.trim();

  if(!text){
    return;
  }

  socket.emit(
    "chat",
    text
  );

  addMessage(
    name,
    text,
    true
  );

  input.value = "";

}


document
.getElementById("messageInput")
.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      sendMessage();

    }

  }
);


socket.on(
  "chat",
  function(data){

    if(
      data.name === name
    ){
      return;
    }

    addMessage(
      data.name || "زائر",
      data.text || "",
      false
    );

  }
);


socket.on(
  "system",
  function(text){

    const div =
    document.createElement("div");

    div.className =
    "msg system";

    div.textContent =
    "• " + text;

    document
    .getElementById("messages")
    .appendChild(div);

  }
);



/* =========================
   حالة الغرفة
========================= */

socket.on(
  "room-state",
  function(state){

    if(!state){
      return;
    }


    if(state.youtube){

      createYouTubePlayer(
        state.youtube
      );

      return;
    }


    if(state.video){

      document
      .getElementById("youtubeBox")
      .style.display = "none";

      video.style.display =
      "block";

      video.src =
      state.video;

      video.load();

    }

  }
);


socket.on(
  "connect",
  function(){

    console.log(
      "Razan connected"
    );

  }
);


socket.on(
  "disconnect",
  function(){

    console.log(
      "Razan disconnected"
    );

  }
);

</script>

</body>
</html>
