<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>رزان</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">

<meta name="theme-color" content="#141422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رزان">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08080f;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

header{
  background:#141422;
  text-align:center;
  padding:25px;
  padding-top:max(25px,env(safe-area-inset-top));
  font-size:30px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#151520;
  padding:25px;
  border-radius:20px;
}

h1{text-align:center}

input{
  width:100%;
  padding:18px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  font-size:18px;
}

button{
  width:100%;
  padding:17px;
  margin:8px 0;
  border:0;
  border-radius:14px;
  background:#6557f5;
  color:white;
  font-size:19px;
  font-weight:bold;
}

.netflix{background:#e50914}
.youtube{background:#ff0000}

video{
  width:100%;
  background:black;
  border-radius:16px;
  margin-top:15px;
}

#youtubePlayer{
  display:none;
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:16px;
  margin-top:15px;
  background:black;
}

#roomPage{display:none}

#messages{
  height:220px;
  overflow-y:auto;
  background:#0d0d16;
  border-radius:14px;
  padding:12px;
  margin-top:15px;
}

.msg{
  padding:9px;
  margin-bottom:5px;
  background:#191925;
  border-radius:9px;
}

.myMsg{background:#312d68}

.systemMsg{
  color:#aaa;
  text-align:center;
  font-size:14px;
}

.code{
  color:#9b8cff;
  font-size:25px;
  font-weight:bold;
}

.note{
  font-size:13px;
  color:#aaa;
  text-align:center;
}
</style>
</head>

<body>

<header>🎬 رزان</header>

<div class="container">

<div id="homePage" class="card">

<h1>🍿 شاهدوا رزان</h1>

<input id="name" placeholder="اسمك" autocomplete="off">

<button type="button" onclick="createRoom()">
إنشاء غرفة
</button>

<input id="roomInput" placeholder="اكتب رمز الغرفة" autocomplete="off">

<button type="button" onclick="joinRoom()">
دخول الغرفة
</button>

</div>


<div id="roomPage" class="card">

<h1>الغرفة</h1>

<p>
رمز الغرفة:
<span id="roomCode" class="code"></span>
</p>


<!-- YouTube -->

<input
id="youtubeUrl"
placeholder="الصق رابط فيديو YouTube">

<button
type="button"
class="youtube"
onclick="loadYouTube()">
▶ تشغيل YouTube للجميع
</button>

<p class="note">
الصق رابط فيديو YouTube وسيظهر داخل رزان عند أعضاء الغرفة.
</p>

<iframe
id="youtubePlayer"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>


<!-- Netflix -->

<input
id="netflixUrl"
placeholder="الصق رابط الفيلم أو الحلقة من Netflix">

<button
type="button"
class="netflix"
onclick="openNetflixTogether()">
▶ فتح Netflix للجميع
</button>


<!-- فيديو مباشر -->

<input
id="videoUrl"
placeholder="رابط فيديو مباشر MP4">

<button
type="button"
onclick="loadVideo()">
تشغيل الفيديو للجميع
</button>

<video id="video" controls playsinline></video>


<!-- الدردشة -->

<div id="messages"></div>

<input
id="messageInput"
placeholder="اكتب رسالة..."
autocomplete="off">

<button
type="button"
onclick="sendMessage()">
إرسال
</button>

</div>
</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let currentRoom = "";
let myName = "";
let receivingSync = false;

const video = document.getElementById("video");
const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const youtubePlayer = document.getElementById("youtubePlayer");


function randomRoom(){

  const chars =
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for(let i=0;i<6;i++){
    code += chars[
      Math.floor(Math.random()*chars.length)
    ];
  }

  return code;
}


function createRoom(){

  myName =
  document.getElementById("name").value.trim();

  if(!myName){
    alert("اكتب اسمك");
    return;
  }

  currentRoom = randomRoom();

  enterRoom();
}


function joinRoom(){

  myName =
  document.getElementById("name").value.trim();

  currentRoom =
  document.getElementById("roomInput")
  .value.trim().toUpperCase();

  if(!myName){
    alert("اكتب اسمك");
    return;
  }

  if(!currentRoom){
    alert("اكتب رمز الغرفة");
    return;
  }

  enterRoom();
}


function enterRoom(){

  document.getElementById("homePage")
  .style.display = "none";

  document.getElementById("roomPage")
  .style.display = "block";

  document.getElementById("roomCode")
  .textContent = currentRoom;

  socket.emit("join",{
    room:currentRoom,
    name:myName
  });
}


/* YOUTUBE */

function getYouTubeId(url){

  try{

    const parsed = new URL(url);

    if(parsed.hostname.includes("youtu.be")){
      return parsed.pathname.slice(1).split("/")[0];
    }

    if(parsed.pathname.includes("/shorts/")){
      return parsed.pathname.split("/shorts/")[1].split("/")[0];
    }

    if(parsed.pathname.includes("/embed/")){
      return parsed.pathname.split("/embed/")[1].split("/")[0];
    }

    return parsed.searchParams.get("v");

  }catch(e){
    return null;
  }
}


function showYouTube(url){

  const id = getYouTubeId(url);

  if(!id){
    alert("رابط YouTube غير صحيح");
    return;
  }

  video.pause();
  video.style.display = "none";

  youtubePlayer.style.display = "block";

  youtubePlayer.src =
  "https://www.youtube.com/embed/" +
  encodeURIComponent(id) +
  "?playsinline=1";
}


function loadYouTube(){

  const url =
  document.getElementById("youtubeUrl")
  .value.trim();

  if(!getYouTubeId(url)){
    alert("الصق رابط YouTube صحيح");
    return;
  }

  socket.emit("youtube",url);
}


socket.on("youtube",(url)=>{
  showYouTube(url);
});


/* NETFLIX */

function openNetflixTogether(){

  let url =
  document.getElementById("netflixUrl")
  .value.trim();

  if(!url){
    url = "https://www.netflix.com/";
  }

  if(
    !url.startsWith("https://www.netflix.com") &&
    !url.startsWith("https://netflix.com")
  ){
    alert("الصق رابط Netflix صحيح");
    return;
  }

  socket.emit("netflix",url);

  window.open(url,"_blank");
}


socket.on("netflix",(url)=>{

  const openIt =
  confirm("🍿 تم إرسال رابط Netflix لك. هل تريد فتحه؟");

  if(openIt){
    window.open(url,"_blank");
  }

});


/* VIDEO */

function loadVideo(){

  const url =
  document.getElementById("videoUrl")
  .value.trim();

  if(!url) return;

  socket.emit("video",url);
}


socket.on("video",(url)=>{

  youtubePlayer.style.display = "none";
  youtubePlayer.src = "";

  video.style.display = "block";
  video.src = url;
  video.load();

});


function sendSync(){

  if(receivingSync) return;

  socket.emit("sync",{
    time:video.currentTime,
    playing:!video.paused
  });

}


video.addEventListener("play",sendSync);
video.addEventListener("pause",sendSync);
video.addEventListener("seeked",sendSync);


socket.on("sync",async(data)=>{

  receivingSync = true;

  if(Math.abs(video.currentTime-data.time)>1){
    video.currentTime = data.time;
  }

  if(data.playing){

    try{
      await video.play();
    }catch(e){}

  }else{
    video.pause();
  }

  setTimeout(()=>{
    receivingSync = false;
  },300);

});


/* CHAT */

function addMessage(name,text,mine=false){

  const div =
  document.createElement("div");

  div.className =
  mine ? "msg myMsg" : "msg";

  div.textContent =
  name + ": " + text;

  messages.appendChild(div);

  messages.scrollTop =
  messages.scrollHeight;
}


function sendMessage(){

  const text =
  messageInput.value.trim();

  if(!text) return;

  addMessage(myName,text,true);

  socket.emit("chat",text);

  messageInput.value = "";
}


messageInput.addEventListener(
"keydown",
(event)=>{

  if(event.key==="Enter"){
    event.preventDefault();
    sendMessage();
  }

});


socket.on("chat",(data)=>{

  if(data.name===myName) return;

  addMessage(
    data.name || "زائر",
    data.text || ""
  );

});


socket.on("system",(text)=>{

  const div =
  document.createElement("div");

  div.className =
  "msg systemMsg";

  div.textContent =
  "• " + text;

  messages.appendChild(div);

});


/* ROOM STATE */

socket.on("room-state",(state)=>{

  if(!state) return;

  if(state.youtube){
    showYouTube(state.youtube);
    return;
  }

  if(state.video){

    video.src = state.video;
    video.load();

    video.addEventListener(
    "loadedmetadata",
    async()=>{

      video.currentTime =
      state.time || 0;

      if(state.playing){
        try{
          await video.play();
        }catch(e){}
      }

    },
    {once:true}
    );

  }

});

</script>

</body>
</html>
